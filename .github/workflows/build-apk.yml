name: 박CTV APK 빌드

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "web/**"        # 웹앱만 바꿨을 때는 APK를 다시 만들지 않음
      - "**.md"
  workflow_dispatch:      # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write         # Releases 에 APK 올리기 위해 필요

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4   # 캐시용

      # Gradle 서버가 일시적으로 504 등 오류를 내도 자동 재시도
      - name: Gradle 8.9 설치
        run: |
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
            -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Gradle 버전 확인
        run: gradle --version

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 시크릿이 없습니다. README 의 'GitHub 설정' 을 확인하세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bakctv.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/bakctv.jks" >> "$GITHUB_ENV"

      - name: APK 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk BakCTV.apk

      - name: Releases 에 배포
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: 박CTV 1.${{ github.run_number }}
          body: "촬영 폰에서 아래 BakCTV.apk 를 눌러 설치하세요."
          files: BakCTV.apk
          make_latest: true
