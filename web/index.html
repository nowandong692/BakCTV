<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박CTV</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#111111">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="박CTV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #111; color: #eee;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.active { display: flex; }

  /* 시작 화면 */
  #home { justify-content: center; align-items: center; padding: 24px; gap: 16px; }
  #home h1 { font-size: 28px; margin-bottom: 8px; }
  #home p.hint { color: #999; font-size: 14px; text-align: center; line-height: 1.5; }
  input { width: 100%; max-width: 320px; padding: 14px; font-size: 18px; border-radius: 12px;
    border: 1px solid #444; background: #222; color: #fff; text-align: center; }
  .btn { width: 100%; max-width: 320px; padding: 16px; font-size: 18px; font-weight: 600;
    border: none; border-radius: 12px; cursor: pointer; color: #fff; }
  .btn.cam { background: #e5484d; }
  .btn.view { background: #3e63dd; }
  .btn:disabled { opacity: .5; }
  .btn.install { background: #30a46c; display: none; }
  .code-check { min-height: 20px; font-size: 14px; margin-top: -8px; }
  .code-check.ok { color: #30a46c; }
  .code-check.bad { color: #f2a33a; }
  #iosHint { display: none; background: #222; border: 1px solid #444; border-radius: 12px;
    padding: 12px 14px; max-width: 320px; font-size: 14px; line-height: 1.5; color: #ccc; text-align: center; }

  /* 영상 화면 */
  .stage { position: relative; flex: 1; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .topbar { position: absolute; top: 0; left: 0; right: 0; padding: 12px 14px;
    padding-top: max(12px, env(safe-area-inset-top));
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(#000a, #0000); font-size: 15px; }
  .status { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; }
  .dot.live { background: #e5484d; animation: blink 1.2s infinite; }
  .dot.ok { background: #30a46c; }
  @keyframes blink { 50% { opacity: .3; } }
  .controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(#0000, #000a); }
  .ctrl { padding: 12px 18px; font-size: 15px; border-radius: 24px; border: none;
    background: #fff2; color: #fff; backdrop-filter: blur(8px); cursor: pointer; }
  .ctrl.danger { background: #e5484dcc; }
  .ctrl.on { background: #30a46c; }
  video.invert { filter: invert(1); }
  .motion-frame { display: none; position: absolute; inset: 0; border: 6px solid #e5484d;
    pointer-events: none; animation: mpulse .8s infinite; }
  @keyframes mpulse { 50% { border-color: #e5484d44; } }
  .motion-box { display: none; position: absolute; border: 3px solid #ff3b3b; border-radius: 4px;
    box-shadow: 0 0 0 2px #0009; pointer-events: none; transition: all .15s; }
  .motion-banner { display: none; position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
    background: #e5484de6; padding: 10px 18px; border-radius: 20px; font-size: 17px; font-weight: 700;
    white-space: nowrap; pointer-events: none; }
  .freeze-banner { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #f2a33aee; color: #111; padding: 14px 20px; border-radius: 14px; font-size: 17px;
    font-weight: 700; text-align: center; line-height: 1.5; pointer-events: none; }
  .motion-info { font-size: 13px; color: #ddd; }
  .proc-src { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; left: 0; top: 0; }
  #cover { display: none; position: fixed; inset: 0; z-index: 100; background: #000;
    align-items: center; justify-content: center; text-align: center;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #cover.show { display: flex; }
  #coverHint { color: #555; font-size: 15px; line-height: 1.7; transition: opacity 1.5s; }
  #coverHint.fade { opacity: 0; }
  .meter { font-size: 13px; letter-spacing: -1px; color: #7ee2a8; margin-left: 6px; }
  .talk-badge { display: none; position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    background: #30a46ce6; padding: 10px 18px; border-radius: 20px; font-size: 16px; font-weight: 600; }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #aaa; font-size: 16px; line-height: 1.6; pointer-events: none; }
</style>
</head>
<body>

<!-- 시작 화면 -->
<div id="home" class="screen active">
  <h1>박CTV</h1>
  <input id="code" type="text" placeholder="방 코드 (예: 박씨네거실-별빛3829)" autocomplete="off">
  <div id="codeCheck" class="code-check"></div>
  <button class="btn cam" id="startCam">이 기기로 촬영하기</button>
  <button class="btn view" id="startView">다른 기기 영상 보기</button>
  <p class="hint">두 기기에 같은 방 코드를 입력하세요.<br>10자 이상, 글자와 숫자를 섞어 주세요.</p>
  <button class="btn install" id="installBtn">📲 앱으로 설치하기</button>
  <div id="iosHint">📲 앱으로 설치하려면<br>Safari 아래쪽 <b>공유 버튼</b> → <b>홈 화면에 추가</b></div>
</div>

<!-- 촬영 화면 -->
<div id="camScreen" class="screen">
  <div class="stage">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="procSrc" class="proc-src" autoplay playsinline muted></video>
    <div class="topbar">
      <div class="status"><span class="dot" id="camDot"></span><span id="camStatus">준비 중…</span><span class="meter" id="camMeter"></span></div>
      <span id="viewerCount">시청 0명</span>
    </div>
    <div id="cover"><span id="coverHint">촬영 중입니다<br>화면을 두 번 누르면 돌아옵니다</span></div>
    <div id="talkBadge" class="talk-badge">🔊 가족이 말하는 중</div>
    <div id="talkAudio"></div>
    <div class="controls">
      <button class="ctrl" id="flipBtn">🔄 카메라 전환</button>
      <button class="ctrl" id="camInvertBtn">🎨 색상 반전</button>
      <button class="ctrl" id="micBtn">🎤 소리 켜짐</button>
      <button class="ctrl" id="coverBtn">🌙 화면 가리기</button>
      <button class="ctrl danger" id="stopCam">■ 종료</button>
    </div>
  </div>
</div>

<!-- 모니터 화면 -->
<div id="viewScreen" class="screen">
  <div class="stage">
    <video id="remoteVideo" autoplay playsinline muted></video>
    <audio id="remoteAudio" autoplay playsinline></audio>
    <div class="msg" id="viewMsg">촬영 기기를 찾는 중…</div>
    <div id="motionFrame" class="motion-frame"></div>
    <div id="motionBox" class="motion-box"></div>
    <div id="motionBanner" class="motion-banner"></div>
    <div id="freezeBanner" class="freeze-banner"></div>
    <div class="topbar">
      <div class="status"><span class="dot" id="viewDot"></span><span id="viewStatus">연결 중…</span><span class="meter" id="viewMeter"></span></div>
      <span id="motionInfo" class="motion-info"></span>
    </div>
    <div class="controls">
      <button class="ctrl" id="soundBtn">🔊 소리 끄기</button>
      <button class="ctrl" id="alertBtn">🔔 알림 켜짐</button>
      <button class="ctrl" id="talkBtn">🎙 말하기</button>
      <button class="ctrl" id="voiceBtn">🎭 목소리: 그대로</button>
      <button class="ctrl" id="invertBtn">🎨 색상 반전</button>
      <button class="ctrl" id="fullBtn">⛶ 전체화면</button>
      <button class="ctrl danger" id="stopView">■ 나가기</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let peer = null;
let localStream = null;
let facing = 'environment';      // 기본: 후면 카메라
let wakeLock = null;
let retryTimer = null;
const calls = new Set();         // 촬영 기기에 연결된 시청자들

// 방 코드 → PeerJS ID (코드를 해시해서 그대로 노출되지 않게)
// 방 코드 → 연결 ID. 일부러 느린 계산(PBKDF2 20만 회)을 써서
// 남이 코드를 하나씩 넣어 보며 맞히는 시도를 매우 느리게 만든다.
async function roomId(code) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(code.trim()), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode('bakctv-room-v2'), iterations: 200000 }, key, 128);
  const hex = [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
  return 'bctv-' + hex;
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

// 방 코드 규칙 검사: 통과하면 null, 아니면 이유를 돌려줌
function codeProblem(code) {
  const chars = [...code];
  if (chars.length < 10) return `10자 이상 필요해요 (지금 ${chars.length}자)`;
  if (!/\d/.test(code)) return '숫자를 하나 이상 넣어 주세요';
  if (!/[^\d\s]/.test(code)) return '숫자만으로는 안 돼요. 글자도 섞어 주세요';
  if (new Set(chars).size < 6) return '같은 글자가 너무 많이 반복돼요';
  if (/(0123|1234|2345|3456|4567|5678|6789|abcd|qwer|asdf|password|admin)/i.test(code))
    return '1234, abcd 같은 쉬운 패턴은 빼 주세요';
  return null;
}
function checkCodeInput() {
  const code = $('code').value.trim();
  const problem = code ? codeProblem(code) : '방 코드를 입력하세요';
  const el = $('codeCheck');
  el.textContent = problem ? '⚠ ' + problem : '✔ 사용할 수 있는 코드예요';
  el.className = 'code-check ' + (problem ? 'bad' : 'ok');
  $('startCam').disabled = $('startView').disabled = !!problem;
}

function getCode() {
  const code = $('code').value.trim();
  const problem = codeProblem(code);
  if (problem) { alert(problem); return null; }
  try { localStorage.setItem('fcam-code', code); } catch (e) {}
  return code;
}

// 화면 꺼짐 방지
async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && peer) keepAwake();
});

/* ---------------- 소리 막대 ---------------- */
let audioCtx = null;
const meters = {};
function ensureAudioCtx() {   // 버튼을 누른 순간에 호출해야 함 (브라우저 정책)
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!audioCtx && AC) audioCtx = new AC();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}
function startMeter(stream, el, key) {
  stopMeter(key);
  if (!stream.getAudioTracks().length) { el.textContent = '🎤 소리 없음'; return; }
  if (!audioCtx) { el.textContent = ''; return; }
  const src = audioCtx.createMediaStreamSource(stream);
  const an = audioCtx.createAnalyser(); an.fftSize = 512;
  src.connect(an);
  const buf = new Uint8Array(an.fftSize);
  const timer = setInterval(() => {
    an.getByteTimeDomainData(buf);
    let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
    const lv = Math.min(5, Math.round(peak / 10));
    el.textContent = '🎤' + '▮'.repeat(lv) + '▯'.repeat(5 - lv);
  }, 120);
  meters[key] = { src, timer, el };
}
function stopMeter(key) {
  const m = meters[key]; if (!m) return;
  clearInterval(m.timer); try { m.src.disconnect(); } catch (e) {}
  m.el.textContent = ''; delete meters[key];
}

/* ---------------- 촬영 기기 ---------------- */
async function getCamera() {
  return navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: true
  });
}

function setCamStatus(text, cls) {
  $('camStatus').textContent = text;
  $('camDot').className = 'dot' + (cls ? ' ' + cls : '');
}
const viewerConns = new Set();   // 시청자에게 정보를 보내는 통로
function updateViewerCount() {
  $('viewerCount').textContent = `시청 ${calls.size}명`;
  viewerConns.forEach(c => { try { if (c.open) c.send({ t: 'viewers', n: calls.size }); } catch (e) {} });
}

async function startCamera() {
  const code = getCode(); if (!code) return;
  ensureAudioCtx();
  show('camScreen');
  setCamStatus('카메라 켜는 중…');
  try {
    localStream = await getCamera();
  } catch (e) {
    alert('카메라를 켤 수 없습니다. 브라우저에서 카메라·마이크 권한을 허용해 주세요.\n(HTTPS 주소에서만 동작합니다)');
    return stopAll();
  }
  if (camInvertOn) startInvertPipeline();
  applyOutVideo();
  updateCamInvertBtn();
  startMeter(localStream, $('camMeter'), 'cam');
  keepAwake();

  peer = new Peer(await roomId(code));
  peer.on('open', () => setCamStatus('촬영 중 · 대기', 'live'));

  // 시청자가 접속하면 → 영상을 보내준다
  peer.on('connection', (conn) => {
    conn.on('open', () => {
      viewerConns.add(conn);
      const call = peer.call(conn.peer, outStream());
      calls.add(call); updateViewerCount();
      const drop = () => { calls.delete(call); updateViewerCount(); };
      call.on('close', drop); call.on('error', drop);
      conn.on('close', () => { viewerConns.delete(conn); call.close(); drop(); });
    });
  });

  // 시청자가 "말하기"를 누르면 → 그 목소리를 이 기기 스피커로 재생
  const talkers = new Set();
  const updateBadge = () => { $('talkBadge').style.display = talkers.size ? 'block' : 'none'; };
  peer.on('call', (call) => {
    call.answer();  // 목소리는 받기만 함
    const audio = document.createElement('audio');
    audio.autoplay = true; audio.playsInline = true;
    $('talkAudio').appendChild(audio);
    call.on('stream', (s) => {
      audio.srcObject = s; audio.play().catch(() => {});
      talkers.add(call); updateBadge();
    });
    const end = () => { audio.remove(); talkers.delete(call); updateBadge(); };
    call.on('close', end); call.on('error', end);
  });

  peer.on('disconnected', () => { setCamStatus('재연결 중…'); peer.reconnect(); });
  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      alert('이 방 코드로 이미 촬영 중인 기기가 있습니다. 다른 코드를 쓰거나 그 기기를 종료하세요.');
      stopAll();
    } else if (err.type === 'network' || err.type === 'server-error') {
      setCamStatus('네트워크 오류 · 재시도 중…');
    }
  });
}

// 전·후면 카메라 전환 (연결된 시청자 영상도 그대로 교체)
// 카메라 열기: 방향(전면/후면)으로 먼저 시도, 안 되면 다른 카메라 장치를 직접 선택
async function openVideo(mode, excludeId) {
  const size = { width: { ideal: 1280 }, height: { ideal: 720 } };
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { ...size, facingMode: { exact: mode } } });
    return st.getVideoTracks()[0];
  } catch (e) {
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const want = mode === 'user' ? /front|user|전면/i : /back|rear|environment|후면/i;
    const pick = cams.find(d => want.test(d.label) && d.deviceId !== excludeId)
              || cams.find(d => d.deviceId !== excludeId);
    if (!pick) throw e;
    const st = await navigator.mediaDevices.getUserMedia({ video: { ...size, deviceId: { exact: pick.deviceId } } });
    return st.getVideoTracks()[0];
  }
}

// 전·후면 카메라 전환 (기존 카메라를 먼저 끄고 새 카메라를 켬)
async function flipCamera() {
  if (!localStream) return;
  const btn = $('flipBtn'); btn.disabled = true;
  const next = facing === 'environment' ? 'user' : 'environment';
  const oldTrack = localStream.getVideoTracks()[0];
  const oldId = oldTrack?.getSettings().deviceId;
  if (oldTrack) { localStream.removeTrack(oldTrack); oldTrack.stop(); }

  let newTrack = null;
  try {
    newTrack = await openVideo(next, oldId);
    facing = next;
  } catch (e) {
    alert('카메라를 전환할 수 없습니다. 원래 카메라로 돌아갑니다.');
    try { newTrack = await openVideo(facing); } catch (e2) {}
  }
  if (newTrack) {
    localStream.addTrack(newTrack);
    if (procTrack) { const ps = $('procSrc'); ps.srcObject = null; ps.srcObject = localStream; ps.play().catch(() => {}); }
    applyOutVideo();
    $('localVideo').style.transform = facing === 'user' ? 'scaleX(-1)' : '';  // 전면은 거울처럼
  }
  btn.disabled = false;
}

/* ---- 촬영 쪽 색상 반전: 캔버스로 반전한 영상을 대신 보낸다 ---- */
let camInvertOn = false;
try { camInvertOn = localStorage.getItem('fcam-cam-invert') === '1'; } catch (e) {}
let procTrack = null;

function startInvertPipeline() {
  if (procTrack || !localStream) return;
  const v = $('procSrc');
  v.srcObject = localStream; v.play().catch(() => {});
  const c = document.createElement('canvas');
  c.width = 1280; c.height = 720;
  const ctx = c.getContext('2d');
  const draw = () => {
    if (!procTrack) return;
    if (v.videoWidth) {
      if (c.width !== v.videoWidth || c.height !== v.videoHeight) { c.width = v.videoWidth; c.height = v.videoHeight; }
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(v, 0, 0, c.width, c.height);
      ctx.globalCompositeOperation = 'difference';   // 흰색과의 차이 = 색상 반전
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
    }
    next();
  };
  const next = () => (v.requestVideoFrameCallback ? v.requestVideoFrameCallback(draw) : requestAnimationFrame(draw));
  procTrack = c.captureStream(30).getVideoTracks()[0];
  next();
}
function stopInvertPipeline() {
  if (procTrack) { procTrack.stop(); procTrack = null; }
  $('procSrc').srcObject = null;
}
function outVideoTrack() {
  return (camInvertOn && procTrack) ? procTrack : localStream.getVideoTracks()[0];
}
function outStream() {
  return new MediaStream([outVideoTrack(), ...localStream.getAudioTracks()]);
}
// 보내는 영상과 미리보기를 현재 설정에 맞게 바꿈
function applyOutVideo() {
  if (!localStream) return;
  const t = outVideoTrack();
  calls.forEach(call => {
    const sender = call.peerConnection?.getSenders().find(s => s.track ? s.track.kind === 'video' : false);
    if (sender) sender.replaceTrack(t).catch(() => {});
  });
  $('localVideo').srcObject = new MediaStream([t]);
}
function updateCamInvertBtn() {
  $('camInvertBtn').textContent = camInvertOn ? '🎨 반전 켜짐' : '🎨 색상 반전';
  $('camInvertBtn').classList.toggle('on', camInvertOn);
}
function toggleCamInvert() {
  camInvertOn = !camInvertOn;
  try { localStorage.setItem('fcam-cam-invert', camInvertOn ? '1' : '0'); } catch (e) {}
  if (camInvertOn) startInvertPipeline(); else stopInvertPipeline();
  applyOutVideo();
  updateCamInvertBtn();
}

function toggleMic() {
  const track = localStream?.getAudioTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  $('micBtn').textContent = track.enabled ? '🎤 소리 켜짐' : '🔇 소리 꺼짐';
}

// 화면 가리기: 촬영은 계속, 화면만 검게 (두 번 누르면 해제)
let hintTimer = null, lastTap = 0;
function showCover() {
  $('cover').classList.add('show');
  $('coverHint').classList.remove('fade');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => $('coverHint').classList.add('fade'), 3000);
  keepAwake();
}
function hideCover() { $('cover').classList.remove('show'); clearTimeout(hintTimer); }
$('cover').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const now = Date.now();
  if (now - lastTap < 400) { hideCover(); lastTap = 0; return; }
  lastTap = now;
  // 한 번 누르면 안내 문구만 잠깐 다시 보여줌
  $('coverHint').classList.remove('fade');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => $('coverHint').classList.add('fade'), 2000);
});

/* ---------------- 모니터 기기 ---------------- */
function setViewStatus(text, cls, msg) {
  $('viewStatus').textContent = text;
  $('viewDot').className = 'dot' + (cls ? ' ' + cls : '');
  $('viewMsg').textContent = msg || '';
  $('viewMsg').style.display = msg ? 'flex' : 'none';
}

async function startViewer() {
  const code = getCode(); if (!code) return;
  ensureAudioCtx();
  show('viewScreen');
  keepAwake();
  const target = await roomId(code);
  viewTarget = target;
  peer = new Peer();

  const connect = () => {
    clearTimeout(retryTimer);
    if (!peer || peer.destroyed) return;
    setViewStatus('연결 중…', '', '촬영 기기를 찾는 중…');
    // 'json' 방식: 촬영 기기가 보내는 움직임 알림을 받기 위해
    let conn;
    try { conn = peer.connect(target, { reliable: true, serialization: 'json' }); }
    catch (e) { conn = peer.connect(target, { reliable: true }); }   // 혹시 json 방식이 안 되면 기본 방식
    conn.on('data', handleCamData);
    conn.on('close', () => scheduleRetry('촬영이 끊겼습니다. 다시 연결하는 중…'));
  };
  const scheduleRetry = (msg) => {
    $('remoteVideo').srcObject = null;
    stopRemoteAudio();
    stopMeter('view');
    hideMotion(); motionLabel = null; recOn = false; viewersN = null; updateMotionInfo();
    stopFrameWatch();
    setViewStatus('대기 중', '', msg);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, 3000);
  };

  peer.on('open', connect);
  peer.on('call', (call) => {
    call.answer();  // 영상은 받기만 함
    call.on('stream', (stream) => {
      $('remoteVideo').srcObject = stream;   // 영상은 video로
      startFrameWatch();
      playRemoteAudio(stream);                // 소리는 별도 audio로
      startMeter(stream, $('viewMeter'), 'view');
      setViewStatus('실시간 보는 중', 'ok');
    });
    call.on('close', () => scheduleRetry('촬영이 끊겼습니다. 다시 연결하는 중…'));
  });
  peer.on('disconnected', () => peer.reconnect());
  peer.on('error', (err) => {
    if (err.type === 'peer-unavailable') {
      scheduleRetry('촬영 중인 기기가 없습니다.\n촬영 기기에서 같은 코드로 시작해 주세요.\n(3초마다 자동으로 다시 찾습니다)');
    } else if (err.type === 'network' || err.type === 'server-error') {
      scheduleRetry('네트워크 오류. 다시 시도하는 중…');
    }
  });
}

let soundOn = true;   // 기본: 소리 켜짐
function updateSoundBtn() { $('soundBtn').textContent = soundOn ? '🔊 소리 끄기' : '🔇 소리 켜기'; }

// 안드로이드(크롬)는 <audio> 로 재생하면 다른 앱 음악을 멈추게 함 →
// Web Audio 로 재생하면 음악과 함께 들림. 아이폰은 Web Audio 경로가 앱 전환 시 끊기는 문제가 있어 기존 방식 유지.
const isIOSDevice = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let remoteRoute = null;   // { src, gain }

function playRemoteAudio(stream) {
  if (!isIOSDevice) {
    ensureAudioCtx();
    if (audioCtx && stream.getAudioTracks().length) {
      if (remoteRoute) { try { remoteRoute.src.disconnect(); } catch (e) {} }
      const src = audioCtx.createMediaStreamSource(stream);
      const gain = audioCtx.createGain();
      gain.gain.value = soundOn ? 1 : 0;
      src.connect(gain); gain.connect(audioCtx.destination);
      remoteRoute = { src, gain };
      $('remoteAudio').srcObject = null;
      // 크롬은 원격 소리가 화면의 video 요소에도 연결돼 있어야 Web Audio 로 흘러나옴 (video 는 음소거 상태로 유지)
      updateSoundBtn();
      return;
    }
  }
  const a = $('remoteAudio');
  a.srcObject = stream;
  a.muted = !soundOn;
  a.play().catch(() => {          // 브라우저가 자동 재생을 막으면 버튼으로 켜도록
    soundOn = false; a.muted = true; updateSoundBtn();
  });
  updateSoundBtn();
}
function stopRemoteAudio() {
  if (remoteRoute) { try { remoteRoute.src.disconnect(); } catch (e) {} remoteRoute = null; }
  $('remoteAudio').srcObject = null;
}
function toggleSound() {
  ensureAudioCtx();
  soundOn = !soundOn;
  if (remoteRoute) {
    remoteRoute.gain.gain.value = soundOn ? 1 : 0;
  } else {
    const a = $('remoteAudio');
    a.muted = !soundOn;
    a.play().catch(() => {});
  }
  updateSoundBtn();
}
// 다른 앱에 갔다 오면 Web Audio 가 멈춰 있을 수 있어 다시 켬
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
});

// 말하기: 이 기기 마이크 → 촬영 기기 스피커
let viewTarget = null, talkCall = null, talkStream = null;
async function toggleTalk() {
  if (talkCall) return stopTalk();
  if (!peer || !viewTarget) return;
  try {
    talkStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) { return alert('마이크를 켤 수 없습니다. 마이크 권한을 허용해 주세요.'); }
  let sendStream = talkStream;
  try { sendStream = await buildVoiceStream(talkStream); } catch (e) { sendStream = talkStream; }
  talkCall = peer.call(viewTarget, sendStream);
  talkCall.on('close', stopTalk);
  talkCall.on('error', stopTalk);
  $('talkBtn').textContent = '🎙 말하는 중 (누르면 끝)';
  $('talkBtn').classList.add('on');
}
function stopTalk() {
  const c = talkCall; talkCall = null;
  if (c) c.close();
  if (talkStream) { talkStream.getTracks().forEach(t => t.stop()); talkStream = null; }
  teardownVoice();
  $('talkBtn').textContent = '🎙 말하기';
  $('talkBtn').classList.remove('on');
}

/* ---------------- 음성 변조 (말하기용, 재미 기능) ---------------- */
const VOICES = [
  ['none', '그대로'], ['chipmunk', '🐿 다람쥐'], ['monster', '👹 괴물'], ['robot', '🤖 로봇'], ['echo', '🏔 메아리'],
];
let voiceType = 'none';
try { voiceType = localStorage.getItem('fcam-voice') || 'none'; } catch (e) {}
let voiceIn = null, voiceOut = null, voiceNodes = [], workletReady = null;

// 실시간 음높이 변경기: 두 개의 읽기 위치를 엇갈리게 움직이며 부드럽게 섞음 (지연 약 30ms)
const PITCH_WORKLET = `
class PitchShift extends AudioWorkletProcessor {
  static get parameterDescriptors() { return [{ name: 'ratio', defaultValue: 1 }]; }
  constructor() { super(); this.size = 8192; this.buf = new Float32Array(this.size); this.w = 0; this.p = 0; this.win = 1400; }
  read(d) { let pos = this.w - d; while (pos < 0) pos += this.size; const i = Math.floor(pos), f = pos - i;
    return this.buf[i % this.size] * (1 - f) + this.buf[(i + 1) % this.size] * f; }
  process(inputs, outputs, params) {
    const inp = inputs[0] && inputs[0][0], out = outputs[0];
    if (!out || !out[0]) return true;
    const ratio = params.ratio[0], step = (1 - ratio) / this.win;
    for (let n = 0; n < out[0].length; n++) {
      this.buf[this.w] = inp ? inp[n] : 0;
      this.p += step; if (this.p >= 1) this.p -= 1; if (this.p < 0) this.p += 1;
      const p2 = (this.p + 0.5) % 1;
      const g1 = Math.sin(Math.PI * this.p) ** 2, g2 = 1 - g1;   // 합이 항상 1 (소리 크기 일정)
      const y = g1 * this.read(this.p * this.win + 1) + g2 * this.read(p2 * this.win + 1);
      for (let c = 0; c < out.length; c++) out[c][n] = y;
      this.w = (this.w + 1) % this.size;
    }
    return true;
  }
}
registerProcessor('pitch-shift', PitchShift);`;

function ensureWorklet() {
  if (!workletReady) {
    workletReady = (audioCtx && audioCtx.audioWorklet)
      ? audioCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([PITCH_WORKLET], { type: 'application/javascript' })))
          .then(() => true).catch(() => false)
      : Promise.resolve(false);
  }
  return workletReady;
}

async function buildVoiceStream(mic) {
  ensureAudioCtx();
  if (!audioCtx) return mic;
  await ensureWorklet();
  teardownVoice();
  voiceIn = audioCtx.createGain();
  audioCtx.createMediaStreamSource(mic).connect(voiceIn);
  voiceOut = audioCtx.createMediaStreamDestination();
  await applyVoice();
  return voiceOut.stream;
}

// 말하는 중에 목소리를 바꿔도 바로 적용
async function applyVoice() {
  if (!voiceIn || !voiceOut) return;
  try { voiceIn.disconnect(); } catch (e) {}
  voiceNodes.forEach(n => { try { n.disconnect(); } catch (e) {} try { n.stop && n.stop(); } catch (e) {} });
  voiceNodes = [];
  const ctx = audioCtx, out = voiceOut;
  const pitch = async (ratio) => {
    if (!(await ensureWorklet())) { voiceIn.connect(out); return; }   // 지원 안 하면 그대로
    const node = new AudioWorkletNode(ctx, 'pitch-shift');
    node.parameters.get('ratio').value = ratio;
    voiceIn.connect(node); voiceNodes.push(node);
    return node;
  };
  if (voiceType === 'chipmunk') {
    const n = await pitch(1.7); if (n) n.connect(out);
  } else if (voiceType === 'monster') {
    const n = await pitch(0.62);
    if (n) {
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
      const boost = ctx.createGain(); boost.gain.value = 1.4;
      n.connect(lp); lp.connect(boost); boost.connect(out); voiceNodes.push(lp, boost);
    }
  } else if (voiceType === 'robot') {
    // 링 변조: 목소리에 낮은 웅웅 소리를 곱함
    const ring = ctx.createGain(); ring.gain.value = 0;
    const osc = ctx.createOscillator(); osc.type = 'square'; osc.frequency.value = 55;
    const depth = ctx.createGain(); depth.gain.value = 1;
    osc.connect(depth); depth.connect(ring.gain); osc.start();
    const boost = ctx.createGain(); boost.gain.value = 1.6;
    voiceIn.connect(ring); ring.connect(boost); boost.connect(out);
    voiceNodes.push(ring, osc, depth, boost);
  } else if (voiceType === 'echo') {
    const delay = ctx.createDelay(1.0); delay.delayTime.value = 0.28;
    const fb = ctx.createGain(); fb.gain.value = 0.45;
    const wet = ctx.createGain(); wet.gain.value = 0.7;
    voiceIn.connect(out);
    voiceIn.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(out);
    voiceNodes.push(delay, fb, wet);
  } else {
    voiceIn.connect(out);
  }
}

function teardownVoice() {
  voiceNodes.forEach(n => { try { n.disconnect(); } catch (e) {} try { n.stop && n.stop(); } catch (e) {} });
  voiceNodes = [];
  if (voiceIn) { try { voiceIn.disconnect(); } catch (e) {} voiceIn = null; }
  voiceOut = null;
}

function updateVoiceBtn() {
  const v = VOICES.find(x => x[0] === voiceType) || VOICES[0];
  $('voiceBtn').textContent = '🎭 목소리: ' + v[1];
  $('voiceBtn').classList.toggle('on', voiceType !== 'none');
}
function cycleVoice() {
  ensureAudioCtx();
  const i = VOICES.findIndex(x => x[0] === voiceType);
  voiceType = VOICES[(i + 1) % VOICES.length][0];
  try { localStorage.setItem('fcam-voice', voiceType); } catch (e) {}
  updateVoiceBtn();
  applyVoice();
}

/* ---------------- 움직임 알림 (보는 쪽) ---------------- */
let alertsOn = true;
try { alertsOn = localStorage.getItem('fcam-alerts') !== '0'; } catch (e) {}
let motionLabel = null, lastMotionAt = 0, lastBox = null, recOn = false, viewersN = null;
const fmtTime = (t) => new Date(t).toLocaleTimeString('ko-KR', { hour12: false });

function handleCamData(d) {
  let m = d;
  try {
    if (m instanceof ArrayBuffer || m instanceof Uint8Array) m = new TextDecoder().decode(m);
    if (typeof m === 'string') m = JSON.parse(m);
  } catch (e) { return; }
  if (!m || typeof m !== 'object') return;
  if (m.t === 'viewers') {
    viewersN = m.n;
    updateMotionInfo();
  } else if (m.t === 'rec') {
    recOn = !!m.on;
    updateMotionInfo();
  } else if (m.t === 'hello') {
    motionLabel = m.label || null;
    recOn = !!m.rec;
    if (typeof m.viewers === 'number') viewersN = m.viewers;
    if (!m.active) hideMotion();
    updateMotionInfo();
  } else if (m.t === 'motion') {
    if (m.on) {
      if (m.start) { lastMotionAt = m.at || Date.now(); alertMotion(); }
      showMotion(m.box);
    } else {
      hideMotion();
    }
    updateMotionInfo();
  }
}

function showMotion(box) {
  $('motionFrame').style.display = 'block';
  const b = $('motionBanner');
  b.textContent = '⚠ 움직임 감지 ' + fmtTime(lastMotionAt || Date.now());
  b.style.display = 'block';
  if (box) { lastBox = box; positionBox(); }
}
function hideMotion() {
  $('motionFrame').style.display = 'none';
  $('motionBanner').style.display = 'none';
  $('motionBox').style.display = 'none';
  lastBox = null;
}
// 감지 영역을 실제로 보이는 영상 위치에 맞춰 그림 (화면 비율 차이 보정)
function positionBox() {
  const v = $('remoteVideo'), el = $('motionBox'), box = lastBox;
  if (!box || !v.videoWidth) return;
  const W = v.clientWidth, H = v.clientHeight;
  const sc = Math.min(W / v.videoWidth, H / v.videoHeight);
  const dw = v.videoWidth * sc, dh = v.videoHeight * sc;
  const ox = (W - dw) / 2, oy = (H - dh) / 2;
  el.style.left = (ox + box[0] * dw) + 'px';
  el.style.top = (oy + box[1] * dh) + 'px';
  el.style.width = Math.max(12, box[2] * dw) + 'px';
  el.style.height = Math.max(12, box[3] * dh) + 'px';
  el.style.display = 'block';
}
window.addEventListener('resize', positionBox);

function updateMotionInfo() {
  let t = (viewersN ? `👀 ${viewersN}명 시청 중 · ` : '') + (recOn ? '🔴 녹화 중 · ' : '');
  if (motionLabel) t += '👁 ' + motionLabel;
  if (lastMotionAt) t += (t && !t.endsWith(' · ') ? ' · ' : '') + '마지막 ' + fmtTime(lastMotionAt);
  t = t.replace(/ · $/, '');
  $('motionInfo').textContent = t;
}

function beep(times = 2) {
  ensureAudioCtx();
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  for (let i = 0; i < times; i++) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880;
    const t = t0 + i * 0.25;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.2);
  }
}
function alertMotion() {
  if (!alertsOn) return;
  beep(2);
  if (navigator.vibrate) navigator.vibrate([300, 120, 300]);
}
function updateAlertBtn() {
  $('alertBtn').textContent = alertsOn ? '🔔 알림 켜짐' : '🔕 알림 꺼짐';
}
function toggleAlerts() {
  alertsOn = !alertsOn;
  try { localStorage.setItem('fcam-alerts', alertsOn ? '1' : '0'); } catch (e) {}
  updateAlertBtn();
  if (alertsOn) beep(1);   // 소리 확인용
}

/* ---------------- 영상 멈춤 감지 (보는 쪽) ---------------- */
// 새 영상 장면이 3초 넘게 안 들어오면 경고 (촬영 폰 시각도 멈춰 보임)
let lastFrameAt = 0, frozenWarned = false, freezeTimer = null, frameWatchOn = false;
function startFrameWatch() {
  const v = $('remoteVideo');
  lastFrameAt = Date.now();
  frozenWarned = false;
  if (!frameWatchOn) {
    frameWatchOn = true;
    if (v.requestVideoFrameCallback) {
      const cb = () => { if (!frameWatchOn) return; lastFrameAt = Date.now(); v.requestVideoFrameCallback(cb); };
      v.requestVideoFrameCallback(cb);
    } else {
      let lastT = -1;
      const poll = () => {
        if (!frameWatchOn) return;
        if (v.currentTime !== lastT) { lastT = v.currentTime; lastFrameAt = Date.now(); }
        setTimeout(poll, 300);
      };
      poll();
    }
  }
  clearInterval(freezeTimer);
  freezeTimer = setInterval(checkFrozen, 1000);
}
function stopFrameWatch() {
  frameWatchOn = false;
  clearInterval(freezeTimer); freezeTimer = null;
  $('freezeBanner').style.display = 'none';
}
function checkFrozen() {
  if (document.hidden || !$('remoteVideo').srcObject) return;
  const sec = Math.floor((Date.now() - lastFrameAt) / 1000);
  const b = $('freezeBanner');
  if (sec >= 3) {
    b.innerHTML = `⚠ 영상이 멈췄어요 (${sec}초째)<br><span style="font-weight:500;font-size:14px">촬영 폰을 확인해 주세요</span>`;
    b.style.display = 'block';
    if (!frozenWarned) {
      frozenWarned = true;
      if (alertsOn) { beep(3); if (navigator.vibrate) navigator.vibrate([500, 200, 500]); }
    }
  } else if (b.style.display !== 'none') {
    b.style.display = 'none';
    frozenWarned = false;
  }
}
// 다른 앱 갔다 돌아오면 바로 경고하지 않도록 시간 초기화
document.addEventListener('visibilitychange', () => { if (!document.hidden) lastFrameAt = Date.now(); });

function toggleFull() {
  const el = $('remoteVideo');
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitEnterFullscreen) el.webkitEnterFullscreen(); // iPhone
}

function stopAll() {
  clearTimeout(retryTimer);
  stopTalk();
  hideCover();
  $('talkAudio').innerHTML = ''; $('talkBadge').style.display = 'none';
  calls.forEach(c => c.close()); calls.clear(); updateViewerCount();
  if (peer) { peer.destroy(); peer = null; }
  stopInvertPipeline();
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  $('localVideo').srcObject = null;
  $('remoteVideo').srcObject = null;
  stopRemoteAudio();
  stopMeter('cam'); stopMeter('view');
  hideMotion(); motionLabel = null; lastMotionAt = 0; viewersN = null; updateMotionInfo();
  stopFrameWatch();
  soundOn = true; updateSoundBtn();
  $('micBtn').textContent = '🎤 소리 켜짐';
  show('home');
}

};
window.addEventListener('appinstalled', () => { $('installBtn').style.display = 'none'; });

// 아이폰: 자동 설치 창이 없으므로 안내 문구 표시
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (isIOS && !isInstalled) $('iosHint').style.display = 'block';
</script>
</body>
</html>
